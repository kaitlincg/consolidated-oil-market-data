name: Update oil market data

on:
  workflow_dispatch:
  schedule:
    # 7:00 p.m. CDT / 6:00 p.m. CST, every day.
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch latest EIA market data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
        run: python scripts/update_oil_market.py

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/oil-market.json
          git diff --cached --quiet || git commit -m "Update oil market data"
          git push
